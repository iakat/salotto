name: ci

# The gate, and the image the two live clients run.
#
# Both jobs are here rather than in a separate release workflow because the image is what a person
# actually looks at: a green unit-test run with an image that nobody rebuilt is how the deployed
# client ends up eleven hours behind the branch, showing bugs that were fixed the same evening. So
# the image is built from the same commit the tests passed on, and every push to dev replaces the
# live tag the deployments pull.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per branch: the image tag is a branch-level pointer, so two builds racing to publish
  # "live" is a deployment that flips between two commits.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: gofmt
        run: make lint

      - name: build
        run: go build ./...

      - name: test
        run: make test

      - name: alloc-gate
        # The ring is the hot path; a per-line allocation there is a per-line allocation for every
        # client on the bouncer.
        run: make alloc-gate

  image:
    needs: gate
    # No pull_request: a fork's PR must not be able to publish a tag the live deployments pull.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: tags
        # ghcr.io requires a lower-case path and the repository owner is not guaranteed to be.
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/$repo:${GITHUB_REF_NAME}"
            echo "ghcr.io/$repo:${GITHUB_SHA::12}"
            # Only the default development branch moves the tag the live clients pull. A feature
            # branch publishing "live" would deploy itself the moment somebody pushed it.
            if [ "${GITHUB_REF_NAME}" = "dev" ]; then echo "ghcr.io/$repo:live"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        run: |
          {
            echo "### image"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            if [ "${GITHUB_REF_NAME}" = "dev" ]; then
              echo "The \`live\` tag moved; alice and bob pull it on their next rollout."
            else
              echo "Branch image only; \`live\` was not moved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
