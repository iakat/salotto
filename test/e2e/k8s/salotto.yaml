# salottod in the e2e environment, pointed at the same ergo as ZNC.
#
# Config is per-network in salotto.toml. The listener is plaintext 6667 because
# the test client is a script inside the cluster; a real deployment terminates
# TLS at the facade (docs/SPEC.md §8).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: salotto-e2e-daemon
  namespace: hermes-generated-content
data:
  salotto.toml: |
    listen = "0.0.0.0:6667"
    server_name = "salotto"
    stats_listen = "0.0.0.0:6668"
    log_dir = "/data/logs"
    ring_segments = 16
    ring_segment_size = 8192
    max_windows = 64
    max_clients = 32

    # ZNC parity knobs (see QUEUE.md B6/B14/B15 and the module rows).
    motd_blocked = false
    motd_missing = false

    [[network]]
    name = "ircd"
    addr = "salotto-e2e-ergo:6667"
    nick = "e2e"
    altnick = "e2e_"
    keepnick = true
    realname = "e2e salotto"
    channels = ["#e2e"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: salotto-e2e-data
  namespace: hermes-generated-content
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salotto-e2e
  namespace: hermes-generated-content
  labels: {app: salotto-e2e}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: salotto-e2e}
  template:
    metadata:
      labels: {app: salotto-e2e}
    spec:
      containers:
        - name: salottod
          image: 10.43.135.163:5000/salotto/salottod:e2e
          args: ["-config", "/etc/salotto/salotto.toml", "-log-level", "info"]
          ports:
            - {name: irc, containerPort: 6667}
            - {name: stats, containerPort: 6668}
          resources:
            limits: {memory: 256Mi, cpu: 300m}
            requests: {memory: 32Mi, cpu: 20m}
          volumeMounts:
            - {name: conf, mountPath: /etc/salotto}
            - {name: data, mountPath: /data}
          readinessProbe:
            tcpSocket: {port: 6667}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: conf
          configMap: {name: salotto-e2e-daemon}
        - name: data
          persistentVolumeClaim: {claimName: salotto-e2e-data}
---
apiVersion: v1
kind: Service
metadata:
  name: salotto-e2e
  namespace: hermes-generated-content
spec:
  selector: {app: salotto-e2e}
  ports:
    - {name: irc, port: 6667, targetPort: 6667}
    - {name: stats, port: 6668, targetPort: 6668}
