apiVersion: batch/v1
kind: Job
metadata:
  name: salotto-e2e-image-build
  namespace: hermes-generated-content
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kaniko
          image: ghcr.io/osscontainertools/kaniko:latest
          args:
            - --context=git://github.com/iakat/salotto.git#refs/heads/dev
            - --dockerfile=Dockerfile
            - --destination=10.43.135.163:5000/salotto/salottod:e2e
            - --insecure
            - --skip-tls-verify
            - --cache=false
            - --verbosity=info
          resources:
            limits: {memory: 4Gi, cpu: "2"}
            requests: {memory: 1Gi, cpu: 500m}
