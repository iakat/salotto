# salotto proof of concept.
# The bouncer holds the upstream IRC connection for you, replays the ring buffer
# to any client that connects, and then forwards the live stream. It does not
# track channels, nicks, topics or modes; your IRC client rebuilds all of that
# from the replayed lines and the stream that follows.

# global
listen = "127.0.0.1:6667"
tls_listen = ""                 # optional, e.g. "127.0.0.1:6697"
tls_cert = ""
tls_key = ""
server_name = "salotto"
stats_listen = "127.0.0.1:6668"
log_dir = ""                     # empty disables logging
log_queue = 4096
# Write message text without IRC colours and control bytes, like ZNC's
# stripcontrols module. Off by default: the log records what was said.
strip_controls = false
log_listen = ""                  # empty disables search; loopback only without token
log_token = ""
ident_listen = ""                # RFC 1413 listener, e.g. ":113"; empty disables ident
ident = ""                       # ident string; empty uses the network's nick
# Replay rings are per window, not per network. The two ring settings below
# therefore apply to EACH window, and max_windows bounds how many windows a
# network keeps (the least recently used is evicted when it is exceeded).
# Arithmetic at the defaults: 8 * 262144 = 2 MiB per window, times 64 windows
# = 128 MiB per network. Multiply by the number of [[network]] sections to size
# the whole process; lower max_windows or ring_segment_size to shrink it.
ring_segments = 8
ring_segment_size = 262144
max_windows = 64
max_clients = 32

# B15: MOTD control, ZNC's block_motd and missingmotd.
# motd_blocked = true suppresses 375/372 and answers 376 with "MOTD blocked by
# ZNC"; motd_missing = true answers login with 422 instead of a MOTD. Turning
# both off serves the bouncer's own one-line MOTD.
motd_blocked = false
motd_missing = false

[user]
bind_host = ""                   # default source address for every network; empty = kernel picks
deny_set_bind_host = false       # operator policy: refuse Set*BindHost from the client

[[network]]
name = "libera"
addr = "irc.libera.chat:6697"
tls = true
nick = "mynick"
realname = "mynick"
pass = ""
# SASL is optional; uncomment both lines and fill them in if the network needs it.
# sasl_user = "mynick"
# sasl_pass = "secret"
# Or authenticate with a client certificate instead (SASL EXTERNAL, ZNC's *cert
# setup): set sasl_external and point at a PEM certificate plus key. The identity
# comes from the certificate, so no username or password is sent.
# altnick = "mynick_"       # tried on 433 nick-in-use
# keepnick = true           # retry nick every 30s while connected (ZNC keepnick)
# perform = ["PRIVMSG NickServ :IDENTIFY hunter2"]   # run on every connect
# clearbufferonmsg = true   # drop buffers when you speak (ZNC clearbufferonmsg)
# away = true               # ZNC simple_away: away when no client is attached
# away_wait = 60            # seconds to wait after the last client detaches
# away_reason = "Auto away at %awaytime%"   # %awaytime% expands to when it was set
# sasl_external = true
# cert_file = "/etc/salotto/client.pem"
# key_file = "/etc/salotto/client.key"
# Channels joined after every successful (re)connect.
channels = ["#chan1", "#chan2"]
bind_host = ""                   # override for this network only; empty = use the user value
insecure_skip_verify = false

[[network]]
name = "freebnc"
addr = "irc.freebnc.net:6697"
tls = true
nick = "mynick"
realname = "mynick"
pass = ""
# sasl_user = "mynick"
# sasl_pass = "secret"
channels = []
bind_host = ""
insecure_skip_verify = false
