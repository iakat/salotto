<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>salotto</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* The page is the terminal. There is no layout to keep in sync with the TUI because
     there is no layout: the model draws it, and this element is the whole visible UI.
     The colours below are only the terminal's own background and foreground; every
     panel colour comes from the program's escape sequences. */
  :root {
    --bg: #12121a;
    --fg: #e6e6f0;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--fg);
    /* No page scroll: the terminal scrolls. A page that bounces under a terminal is
       how a phone user loses their place in a conversation. */
    overflow: hidden;
    overscroll-behavior: none;
  }
  #term {
    width: 100vw; height: 100vh; height: 100dvh;
    /* The safe area matters on a phone: without it the last line sits under the home
       indicator and the first under the notch. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #term .xterm { height: 100%; }
  /* A banner for the one thing a terminal cannot say about itself: the socket is gone
     and it is trying to reconnect. */
  #banner {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(8px + env(safe-area-inset-top)); z-index: 10;
    padding: 6px 14px; border-radius: 4px;
    background: #5a2020; color: #ffdede;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    pointer-events: none; display: none;
  }
  #banner.on { display: block; }
  /* The one control the page owns. A terminal that reports the mouse to the program cannot
     also select with it, and on a phone there is no Shift to fall back on - so selecting needs
     a button. It sits in the corner the program does not draw in and is small enough to be
     out of the way of the conversation. */
  #selectmode {
    position: fixed; z-index: 20;
    right: calc(8px + env(safe-area-inset-right));
    bottom: calc(8px + env(safe-area-inset-bottom));
    padding: 6px 10px; border-radius: 4px;
    border: 1px solid #3a3a55; background: #1c1c2a; color: #b9b9cc;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: pointer; opacity: 0.55;
  }
  #selectmode:hover, #selectmode.on { opacity: 1; }
  #selectmode.on { border-color: #6a6aa8; color: #e6e6f0; }
  /* The notifications control. Same reasoning as select: the page owns the one thing the
     terminal cannot say, which here is "this device can be told about a mention while the
     tab is closed". It is a second small button and it only appears once the service worker
     is registered, so a browser without push never sees a dead control. */
  #notify {
    position: fixed; z-index: 20;
    left: calc(8px + env(safe-area-inset-left));
    bottom: calc(8px + env(safe-area-inset-bottom));
    padding: 6px 10px; border-radius: 4px;
    border: 1px solid #3a3a55; background: #1c1c2a; color: #b9b9cc;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: pointer; opacity: 0.55; display: none;
  }
  #notify.on { opacity: 1; }
  #notify.on { border-color: #3ad08a; color: #e6e6f0; }
</style>
</head>
<body>
<div id="term"></div>
<div id="banner"></div>
<button id="selectmode" title="select text to copy">&#8599; select</button>
<button id="notify" title="notify this device about mentions">&#9787; notify</button>
<script src="/xterm.js"></script>
<script src="/term.js"></script>
</body>
</html>
